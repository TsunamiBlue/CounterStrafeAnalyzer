name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name CounterStrafeAnalyzer --collect-all matplotlib --collect-all pynput main.py

      - name: Package source archive
        run: |
          git archive --format=zip --output "dist/CounterStrafeAnalyzer-${{ github.ref_name }}-source.zip" HEAD

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CounterStrafeAnalyzer-windows
          path: |
            dist/CounterStrafeAnalyzer.exe
            dist/CounterStrafeAnalyzer-${{ github.ref_name }}-source.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CounterStrafeAnalyzer.exe
            dist/CounterStrafeAnalyzer-${{ github.ref_name }}-source.zip
